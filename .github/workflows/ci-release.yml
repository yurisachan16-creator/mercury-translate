name: Verify and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MERCURY_OCR_BASE_URL: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/{1}/releases/download/{2}', github.server_url, github.repository, github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:build
      - run: pnpm zip
      - name: Check committed whitespace
        shell: bash
        env:
          MERCURY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          diff_base="${MERCURY_DIFF_BASE}"
          if [[ -z "${diff_base}" || "${diff_base}" =~ ^0+$ ]] || ! git cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
            diff_base="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          git diff --check "${diff_base}" "${GITHUB_SHA}"
      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          unzip -t ".output/mercury-translate-${package_version}-chrome.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mercury-translate-chrome
          path: |
            .output/chrome-mv3/**
            .output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MERCURY_OCR_BASE_URL: ${{ format('{0}/{1}/releases/download/{2}', github.server_url, github.repository, github.ref_name) }}
      TESSDATA_COMMIT: 87416418657359cb625c412a48b6e1d6d41c29bd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}; expected ${expected_tag}."
            exit 1
          fi
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:build
      - run: pnpm zip
      - name: Check committed whitespace
        shell: bash
        env:
          MERCURY_DIFF_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          diff_base="${MERCURY_DIFF_BASE}"
          if [[ -z "${diff_base}" || "${diff_base}" =~ ^0+$ ]] || ! git cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
            diff_base="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          git diff --check "${diff_base}" "${GITHUB_SHA}"
      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          unzip -t ".output/mercury-translate-${package_version}-chrome.zip"
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp .output/*-chrome.zip "release/mercury-translate-${GITHUB_REF_NAME}-chrome.zip"
          cp THIRD_PARTY_NOTICES.md release/
          cp INSTALL.md LICENSE NOTICE release/
          git archive --format=tar.gz \
            --prefix="mercury-translate-${GITHUB_REF_NAME}/" \
            --output="release/mercury-translate-${GITHUB_REF_NAME}-source.tar.gz" \
            "$GITHUB_SHA"
          for language in eng chi_sim chi_tra jpn kor; do
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/${TESSDATA_COMMIT}/${language}.traineddata" \
              --output "release/${language}.traineddata"
          done
          cd release
          sha256sum mercury-translate-*.zip mercury-translate-*-source.tar.gz *.traineddata THIRD_PARTY_NOTICES.md INSTALL.md LICENSE NOTICE > SHA256SUMS
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "Mercury Translate ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
